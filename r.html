<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ec" />
    <!--
      /r/* canlı oda linklerinin girişi: index.html ile aynı uygulamayı yükler, yalnızca
      sosyal önizleme etiketleri farklıdır (WhatsApp vb. JS çalıştırmaz, bunları
      sunucudan gelen HTML'den okur). Netlify: public/_redirects → /r/* → /r.html.
      og:url bilinçli olarak yok: önizleme her odanın kendi adresine bağlı kalsın.
      Kurucu adı burada yok (statik dosya); davet metninde geçer.
    -->
    <title>Canlı pusula · Character Compass</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Arkadaşların seni canlı pusula oyununa çağırıyor. Birbirinize madde yazın, sonra kimin kim olduğunu birlikte tahmin edin."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Character Compass" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="Canlı pusula: odaya katıl" />
    <meta
      property="og:description"
      content="Arkadaşların seni canlı pusula oyununa çağırıyor. Birbirinize madde yazın, sonra kimin kim olduğunu birlikte tahmin edin."
    />
    <meta property="og:image" content="https://compass.meteucar.com/og-room.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Odaya katılan arkadaşların yuvarlak fotoğrafları yerine soru işaretleri ve “Canlı pusula” yazısı." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canlı pusula: odaya katıl" />
    <meta
      name="twitter:description"
      content="Arkadaşların seni canlı pusula oyununa çağırıyor. Birbirinize madde yazın, sonra kimin kim olduğunu birlikte tahmin edin."
    />
    <meta name="twitter:image" content="https://compass.meteucar.com/og-room.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
