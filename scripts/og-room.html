<!doctype html>
<!--
  public/og-room.png kaynağı (1200×630, /r/* canlı oda linklerinin sosyal önizlemesi).
  Gerçek kişi adı ya da fotoğrafı yok: oyuncular soru işaretli yuvarlaklar.

  Yeniden üretmek için (proje kökünden, Chrome kurulu olmalı):
    pnpm og:room
-->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: Archivo;
        font-weight: 500;
        src: url('../node_modules/@fontsource/archivo/files/archivo-latin-ext-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: Archivo;
        font-weight: 700;
        src: url('../node_modules/@fontsource/archivo/files/archivo-latin-ext-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: Archivo;
        font-weight: 900;
        src: url('../node_modules/@fontsource/archivo/files/archivo-latin-ext-900-normal.woff2') format('woff2');
      }

      :root {
        --ink: #121212;
        --paper: #fff8ec;
        --accent: #ffd23f;
        --muted: #6b6257;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: Archivo, sans-serif;
        color: var(--ink);
        background: var(--paper);
        background-image: radial-gradient(rgb(18 18 18 / 0.13) 1.5px, transparent 1.5px);
        background-size: 20px 20px;
      }

      /* Sol: başlık */
      .left {
        position: absolute;
        left: 64px;
        top: 64px;
        width: 500px;
      }
      .badge {
        display: flex;
        width: 76px;
        height: 76px;
        align-items: center;
        justify-content: center;
        border: 4px solid var(--ink);
        border-radius: 16px;
        background: var(--accent);
        box-shadow: 6px 6px 0 0 var(--ink);
      }
      .kicker {
        margin-top: 34px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      h1 {
        margin-top: 2px;
        font-size: 112px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }
      h1 .q {
        display: inline-block;
        margin-left: 10px;
        padding: 0 18px 4px;
        border: 5px solid var(--ink);
        border-radius: 18px;
        background: var(--accent);
        box-shadow: 7px 7px 0 0 var(--ink);
        line-height: 1;
        transform: rotate(4deg);
      }
      .sub {
        margin-top: 40px;
        font-size: 27px;
        line-height: 1.25;
        font-weight: 700;
      }
      .url {
        display: inline-block;
        margin-top: 34px;
        padding: 10px 18px;
        border: 4px solid var(--ink);
        border-radius: 12px;
        background: #fff;
        box-shadow: 6px 6px 0 0 var(--ink);
        font-size: 26px;
        font-weight: 700;
      }

      h1 {
        font-size: 104px;
        white-space: normal;
        line-height: 0.95;
      }

      /* Sağ: lobi */
      .lobby {
        position: absolute;
        left: 640px;
        top: 70px;
        width: 500px;
        height: 490px;
        padding: 28px 30px;
        border: 5px solid var(--ink);
        border-radius: 26px;
        background: #fff;
        box-shadow: 10px 10px 0 0 var(--ink);
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: var(--accent);
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }
      .dot {
        width: 14px;
        height: 14px;
        border: 2.5px solid var(--ink);
        border-radius: 50%;
        background: #e5484d;
      }
      .count {
        float: right;
        margin-top: 6px;
        font-size: 22px;
        font-weight: 700;
        color: var(--muted);
      }
      .people {
        clear: both;
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 14px;
      }
      .p {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .avatar {
        display: flex;
        width: 86px;
        height: 86px;
        align-items: center;
        justify-content: center;
        border: 4px solid var(--ink);
        border-radius: 50%;
        font-size: 44px;
        font-weight: 900;
      }
      .a0 { background: #ffadad; }
      .a1 { background: #a0c4ff; }
      .a2 { background: #caffbf; }
      .a3 { background: #fdffb6; }
      .bar {
        width: 74px;
        height: 14px;
        border-radius: 7px;
        background: rgb(18 18 18 / 0.16);
      }
      .start {
        position: absolute;
        left: 30px;
        right: 30px;
        bottom: 28px;
        padding: 14px 0;
        border: 4px solid var(--ink);
        border-radius: 14px;
        background: var(--accent);
        box-shadow: 5px 5px 0 0 var(--ink);
        text-align: center;
        font-size: 26px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="badge" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <polygon points="20,3 26,20 14,20" fill="#e5484d" stroke="#121212" stroke-width="2.5" stroke-linejoin="round" />
          <polygon points="20,37 14,20 26,20" fill="#fff" stroke="#121212" stroke-width="2.5" stroke-linejoin="round" />
          <circle cx="20" cy="20" r="2.5" fill="#121212" />
        </svg>
      </div>
      <p class="kicker">Arkadaşların seni çağırıyor</p>
      <h1>Canlı<br />pusula</h1>
      <p class="sub">Birbirinize madde yazın,<br />kimin kim olduğunu birlikte bulun.</p>
      <p class="url">compass.meteucar.com</p>
    </div>

    <div class="lobby" aria-hidden="true">
      <span class="live"><span class="dot"></span>CANLI ODA</span>
      <span class="count">8/16 kişi</span>
      <div class="people">
        <div class="p"><div class="avatar a0">?</div><div class="bar"></div></div>
        <div class="p"><div class="avatar a1">?</div><div class="bar"></div></div>
        <div class="p"><div class="avatar a2">?</div><div class="bar"></div></div>
        <div class="p"><div class="avatar a3">?</div><div class="bar"></div></div>
        <div class="p"><div class="avatar a0">?</div><div class="bar"></div></div>
        <div class="p"><div class="avatar a1">?</div><div class="bar"></div></div>
        <div class="p"><div class="avatar a2">?</div><div class="bar"></div></div>
        <div class="p"><div class="avatar a3">?</div><div class="bar"></div></div>
      </div>
      <div class="start">Odaya katıl</div>
    </div>
  </body>
</html>
